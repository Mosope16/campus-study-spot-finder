<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="lamp-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)" />

  <!-- Ambient Glow circle -->
  <circle cx="256" cy="240" r="140" fill="#6366f1" opacity="0.25" filter="url(#glow)" />

  <!-- Map Pin Body -->
  <path d="M256 96 C190 96 136 150 136 216 C136 298 238 396 251 408 C254 411 258 411 261 408 C274 396 376 298 376 216 C376 150 322 96 256 96 Z" fill="url(#lamp-grad)" />

  <!-- Inner Pin Badge -->
  <circle cx="256" cy="216" r="64" fill="#0f172a" />

  <!-- Book & Sparkle / Lamp inside -->
  <!-- Open Book -->
  <path d="M224 200 C234 196 248 196 256 202 C264 196 278 196 288 200 C292 201 296 205 296 210 L296 230 C296 233 293 236 289 235 C279 231 267 232 256 238 C245 232 233 231 223 235 C219 236 216 233 216 230 L216 210 C216 205 220 201 224 200 Z" fill="#38bdf8" />
  
  <!-- Light Beam / Sparkle -->
  <circle cx="256" cy="182" r="6" fill="#facc15" filter="url(#glow)" />
</svg>
